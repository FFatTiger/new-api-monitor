services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: new-api-monitor-clickhouse
    restart: unless-stopped
    cpus: ${NEW_API_MONITOR_CLICKHOUSE_CPUS:-1.0}
    mem_limit: ${NEW_API_MONITOR_CLICKHOUSE_MEMORY:-4g}
    environment:
      CLICKHOUSE_DB: ${NEW_API_MONITOR_CLICKHOUSE_DATABASE:-new_api_monitor}
      CLICKHOUSE_USER: ${NEW_API_MONITOR_CLICKHOUSE_USER:-monitor}
      CLICKHOUSE_PASSWORD: ${NEW_API_MONITOR_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user $$CLICKHOUSE_USER --password $$CLICKHOUSE_PASSWORD --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [monitor-internal]

  new-api-monitor:
    image: fffattiger/new-api-monitor:dev-latest
    container_name: new-api-monitor
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "${NEW_API_MONITOR_PORT:-31891}:31891"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 31891
      DATABASE_URL: ${NEW_API_MONITOR_DATABASE_URL}
      API_BASE_URL: ${NEW_API_MONITOR_API_BASE_URL}
      API_MANAGEMENT_KEY: ${NEW_API_MONITOR_API_MANAGEMENT_KEY}
      ZAI_API_KEY: ${NEW_API_MONITOR_ZAI_API_KEY:-}
      MINIMAX_API_KEY: ${NEW_API_MONITOR_MINIMAX_API_KEY:-}
      MINIMAX_API_REGION: ${NEW_API_MONITOR_MINIMAX_API_REGION:-auto}
      MINIMAX_API_BASE_URL: ${NEW_API_MONITOR_MINIMAX_API_BASE_URL:-}
      QUOTA_USAGE_GROUPS: ${NEW_API_MONITOR_QUOTA_USAGE_GROUPS:-}
      QUOTA_SNAPSHOT_INTERVAL_SECONDS: ${NEW_API_MONITOR_QUOTA_SNAPSHOT_INTERVAL_SECONDS:-300}
      DASHBOARD_ROLLUP_WORKER_ENABLED: "false"
      DASHBOARD_ROLLUP_READS_ENABLED: "false"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: ${NEW_API_MONITOR_CLICKHOUSE_DATABASE:-new_api_monitor}
      CLICKHOUSE_USER: ${NEW_API_MONITOR_CLICKHOUSE_USER:-monitor}
      CLICKHOUSE_PASSWORD: ${NEW_API_MONITOR_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_SYNC_ENABLED: ${NEW_API_MONITOR_CLICKHOUSE_SYNC_ENABLED:-false}
      CLICKHOUSE_READS_ENABLED: ${NEW_API_MONITOR_CLICKHOUSE_READS_ENABLED:-false}
      CLICKHOUSE_SYNC_BATCH_SIZE: ${NEW_API_MONITOR_CLICKHOUSE_SYNC_BATCH_SIZE:-5000}
      CLICKHOUSE_SYNC_PAUSE_MS: ${NEW_API_MONITOR_CLICKHOUSE_SYNC_PAUSE_MS:-1000}
      CLICKHOUSE_QUERY_TIMEOUT_MS: ${NEW_API_MONITOR_CLICKHOUSE_QUERY_TIMEOUT_MS:-3000}
      CLICKHOUSE_MAX_THREADS: ${NEW_API_MONITOR_CLICKHOUSE_MAX_THREADS:-2}
      CLICKHOUSE_MAX_ROWS_TO_READ: ${NEW_API_MONITOR_CLICKHOUSE_MAX_ROWS_TO_READ:-5000000}
      CLICKHOUSE_MAX_BYTES_TO_READ: ${NEW_API_MONITOR_CLICKHOUSE_MAX_BYTES_TO_READ:-1073741824}
      CLICKHOUSE_MAX_MEMORY_USAGE: ${NEW_API_MONITOR_CLICKHOUSE_MAX_MEMORY_USAGE:-536870912}
      CLICKHOUSE_MAX_CONCURRENT_QUERIES: ${NEW_API_MONITOR_CLICKHOUSE_MAX_CONCURRENT_QUERIES:-2}
      CLICKHOUSE_MAX_QUEUED_QUERIES: ${NEW_API_MONITOR_CLICKHOUSE_MAX_QUEUED_QUERIES:-8}
    networks: [monitor-internal]

networks:
  monitor-internal:
    driver: bridge

volumes:
  clickhouse-data:
