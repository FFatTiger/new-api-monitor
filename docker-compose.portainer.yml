services:
  new-api-monitor:
    image: fffattiger/new-api-monitor:dev-latest
    container_name: new-api-monitor
    restart: unless-stopped
    ports:
      - "${NEW_API_MONITOR_PORT:-31891}:31891"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 31891
      DATABASE_URL: ${NEW_API_MONITOR_DATABASE_URL}
      API_BASE_URL: ${NEW_API_MONITOR_API_BASE_URL}
      API_MANAGEMENT_KEY: ${NEW_API_MONITOR_API_MANAGEMENT_KEY}
      ZAI_API_KEY: ${NEW_API_MONITOR_ZAI_API_KEY:-}
      MINIMAX_API_KEY: ${NEW_API_MONITOR_MINIMAX_API_KEY:-}
      MINIMAX_API_REGION: ${NEW_API_MONITOR_MINIMAX_API_REGION:-auto}
      MINIMAX_API_BASE_URL: ${NEW_API_MONITOR_MINIMAX_API_BASE_URL:-}
      QUOTA_USAGE_GROUPS: ${NEW_API_MONITOR_QUOTA_USAGE_GROUPS:-}
      QUOTA_SNAPSHOT_INTERVAL_SECONDS: ${NEW_API_MONITOR_QUOTA_SNAPSHOT_INTERVAL_SECONDS:-300}
